---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
    
      <article class="page" itemscope itemtype="http://schema.org/CreativeWork">
        {% if page.title %}<meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">{% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>
    
    <script type='text/javascript' id='mapmyvisitors' src='https://mapmyvisitors.com/map.js?cl=efefef&w=318&t=tt&d=POB8O03weGHGPzMo0jaL1oN_vapDuJB1Un_6kY0uxsc&co=00477a&ct=dbdbdb&cmo=7c7c7c&cmn=00b510'></script>
    
    <div style="text-align: center">
      <img src="https://visitor-badge.laobi.icu/badge?page_id=Chord-Chen-30.Chord-Chen-30.github.io" alt="Vist"/>
    </div>

    <a class="spidey-easter" href="{{ site.baseurl }}/spidey-tracker/" title="" aria-label="Spidey Tracker">
      <img src="{{ site.baseurl }}/images/spidey-pixel.png" alt="" width="18" height="18" />
    </a>
    <style>
      .spidey-easter {
        position: fixed;
        left: 10px;
        bottom: 8px;
        z-index: 2;
        line-height: 0;
        opacity: 0.22;
        transition: opacity 0.25s ease;
      }
      .spidey-easter:hover,
      .spidey-easter:focus {
        opacity: 0.95;
      }
      .spidey-easter img {
        display: block;
        width: 18px;
        height: 18px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
    
    {% include scripts.html %}

  </body>
</html>
