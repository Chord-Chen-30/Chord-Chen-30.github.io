# Build Jekyll → publish static site to the gh-pages branch.
#
# One-time Settings → Pages → Build and deployment:
#   Source: Deploy from a branch
#   Branch: gh-pages / (root)
# (Branch appears after this workflow succeeds once.)

name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pre-create so the dir is owned by the runner (docker build runs as root).
      - name: Prepare output dir
        run: mkdir -p _site

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add .nojekyll
        run: sudo touch _site/.nojekyll && sudo chown -R "$USER:$USER" _site && ls -la _site | head

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
