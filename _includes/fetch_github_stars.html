<script>
  (function () {
    // Match GitHub repo-page compact counts: 337, 1.1k, 19.9k (never 19.9 → 20k).
    function formatStars(n) {
      if (n < 1000) return String(n);
      var units = [
        { value: 1e9, suffix: 'B' },
        { value: 1e6, suffix: 'M' },
        { value: 1e3, suffix: 'k' }
      ];
      for (var i = 0; i < units.length; i++) {
        if (n >= units[i].value) {
          var rounded = Math.round((n / units[i].value) * 10) / 10;
          var text = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
          return text + units[i].suffix;
        }
      }
      return String(n);
    }

    function fillStars(el, count) {
      el.textContent = formatStars(count);
    }

    document.addEventListener('DOMContentLoaded', function () {
      var els = document.querySelectorAll('.github-stars[data-repo]');
      Array.prototype.forEach.call(els, function (el) {
        var repo = el.getAttribute('data-repo');
        if (!repo) return;
        fetch('https://api.github.com/repos/' + repo)
          .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
          .then(function (data) {
            if (typeof data.stargazers_count === 'number') {
              fillStars(el, data.stargazers_count);
            }
          })
          .catch(function () { /* keep fallback text in the span */ });
      });
    });
  })();
</script>
